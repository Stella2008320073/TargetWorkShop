workflows:
  macos-build:
    name: 靶场工坊 macOS 构建
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      xcode: latest
    scripts:
      - name: 编译并打包为 App
        script: |
          # 1. 编译 Swift 可执行文件
          swift build -c release
          
          # 2. 手动构建 .app 包的结构 (Codemagic 自动打包标准流程)
          APP_NAME="靶场工坊"
          mkdir -p build/"${APP_NAME}.app"/Contents/MacOS
          mkdir -p build/"${APP_NAME}.app"/Contents/Resources
          
          # 3. 将编译好的二进制文件拷贝进 App 包
          cp .build/release/TargetWorkshop build/"${APP_NAME}.app"/Contents/MacOS/"${APP_NAME}"
          
          # 4. 生成 Info.plist（这是 macOS App 运行必需的配置）
          cat <<EOF > build/"${APP_NAME}.app"/Contents/Info.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleExecutable</key>
              <string>${APP_NAME}</string>
              <key>CFBundleIdentifier</key>
              <string>com.workshop.target</string>
              <key>CFBundleName</key>
              <string>${APP_NAME}</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>CFBundleShortVersionString</key>
              <string>1.0</string>
              <key>LSMinimumSystemVersion</key>
              <string>13.0</string>
              <key>NSHighResolutionCapable</key>
              <true/>
          </dict>
          </plist>
          EOF
          
    artifacts:
      - build/*.app
